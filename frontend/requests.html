<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HerAid: I can help</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .hidden { display: none; }
    .req-list { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(290px, 100%), 1fr)); }
    .req-card { display: flex; flex-direction: column; gap: 8px; transition: transform 0.15s, box-shadow 0.15s; }
    .req-card:hover { transform: translateY(-3px); box-shadow: 0 14px 28px rgba(74, 28, 28, 0.14); }
    .req-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .req-item { font-size: 1.2rem; font-weight: 700; }
    .req-who { color: var(--brown-soft); font-size: 0.92rem; }
    .req-where { background: var(--blush); border-radius: 8px; padding: 8px 12px; font-size: 0.95rem; }
    .req-time { font-weight: 700; color: var(--red); font-variant-numeric: tabular-nums; }
    .req-time.low { color: var(--amber); }
    .mine-tag { color: var(--grey); font-style: italic; text-align: center; padding: 10px 0; }
    .thanks {
      background: #e5f4ea; border: 1px solid #b9dcc6; border-left: 5px solid var(--green);
      border-radius: 12px; padding: 16px 18px; margin-bottom: 18px;
    }
    .thanks h2 { color: var(--green); font-size: 1.2rem; margin-bottom: 4px; }
  </style>
</head>
<body>

  <header class="nav">
    <div class="container">
      <a href="index.html" class="brand">
        <span class="logo" aria-hidden="true">HA</span>
        HerAid
      </a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="request.html">I Need Help</a>
        <a href="requests.html" class="active">I Can Help</a>
        <a href="my-activity.html">My Activity</a>
        <span id="nav-auth"></span>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="page-head">
      <div class="pill"><b>●</b> Live: updates by itself</div>
      <h1>Students who need <span>help right now</span></h1>
      <p class="section-sub">Got a spare pad or tampon? Tap "I Can Help" and bring it to the spot shown.</p>
    </div>

    <div id="thanks" class="thanks hidden"></div>
    <div class="form-msg" id="msg"></div>

    <section class="section" style="padding-top: 10px;">
      <div class="req-list" id="list"></div>
      <div class="empty hidden" id="empty">No one needs help right now. Check back soon 💗</div>
    </section>
  </main>

  <footer class="footer">
    HerAid: made with care by students, for students.
  </footer>

  <script src="js/common.js"></script>
  <script src="js/help.js"></script>
</body>
</html>
